version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. ISSUER AGENT (Handles Registration & Issuing IDs)
  # ---------------------------------------------------------
  issuer-acapy:
    container_name: bracu-issuer-agent
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.12-1.2.0
    ports:
      - "8020:8000" # ADMIN PORT (FastAPI issues credentials here)
      - "8021:8001" # HTTP PORT  (Mobile wallet talks to this via Ngrok 1)
    environment:
      - ACAPY_GENESIS_URL=http://test.bcovrin.vonx.io/genesis
      
      # SEED IS REQUIRED HERE (to write to BCovrin)
      - ACAPY_WALLET_SEED=brac_university_portal_seed_0001
      
      # NGROK TUNNEL 1 (Must point to local port 8021)
      - ACAPY_ENDPOINT=https://unloveable-macromolecular-leif.ngrok-free.dev
      
      - ACAPY_LABEL=BRAC_Registrar
      - ACAPY_INBOUND_TRANSPORT=[["http", "0.0.0.0", "8001"]]
      - ACAPY_OUTBOUND_TRANSPORT=["http"]
      - ACAPY_ADMIN=["0.0.0.0", "8000"]
      - ACAPY_ADMIN_INSECURE_MODE=true
      - ACAPY_WALLET_TYPE=askar
      - ACAPY_WALLET_NAME=issuer_wallet
      - ACAPY_WALLET_KEY=issuer_secret_key
      - ACAPY_AUTO_PROVISION=true
      - ACAPY_AUTO_ACCEPT_INVITES=true
      - ACAPY_AUTO_ACCEPT_REQUESTS=true
      - ACAPY_LOG_LEVEL=info
      - ACAPY_PRESERVE_EXCHANGE_RECORDS=true
    command: start

  # ---------------------------------------------------------
  # 2. VERIFIER AGENT (Handles Login & Lab Access)
  # ---------------------------------------------------------
  verifier-acapy:
    container_name: bracu-verifier-agent
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.12-1.2.0
    ports:
      - "8030:8000" # ADMIN PORT (FastAPI requests proofs here)
      - "8031:8001" # HTTP PORT  (Mobile wallet talks to this via Ngrok 2)
    environment:
      - ACAPY_GENESIS_URL=http://test.bcovrin.vonx.io/genesis
      
      # NO SEED NEEDED (Verifiers only read from the ledger)
      
      # NGROK TUNNEL 2 (Must point to local port 8031)
      - ACAPY_ENDPOINT=https://choosing-oven-twisted-experiencing.trycloudflare.com 
      
      - ACAPY_LABEL=BRAC_Campus_Services
      - ACAPY_INBOUND_TRANSPORT=[["http", "0.0.0.0", "8001"]]
      - ACAPY_OUTBOUND_TRANSPORT=["http"]
      - ACAPY_ADMIN=["0.0.0.0", "8000"]
      - ACAPY_ADMIN_INSECURE_MODE=true
      - ACAPY_WALLET_TYPE=askar
      - ACAPY_WALLET_NAME=verifier_wallet
      - ACAPY_WALLET_KEY=verifier_secret_key
      - ACAPY_AUTO_PROVISION=true
      - ACAPY_AUTO_ACCEPT_INVITES=true
      - ACAPY_AUTO_ACCEPT_REQUESTS=true
      - ACAPY_AUTO_VERIFY_PRESENTATION=true
      - ACAPY_LOG_LEVEL=info
      - ACAPY_PRESERVE_EXCHANGE_RECORDS=true
    command: start